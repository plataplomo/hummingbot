# CyberDeltaEngine Configuration for Prototype 0.0.1

# General settings
general:
  log_level: INFO
  log_file: "logs/cyberdelta.log"
  module_log_levels:
    "cyberdelta.engine": "INFO"
    "cyberdelta.exchange": "INFO"
    "cyberdelta.strategy": "INFO"
    "cyberdelta.risk": "INFO"
    "cyberdelta.execution": "INFO"
    "cyberdelta.safety_systems": "INFO"
  safe_mode: true  # Start in safe mode (read-only)
  state_file: "data/state.json"
  state_backup_directory: "data/state_backups"
  state_save_interval: 300  # seconds
  state_backup_count: 5     # Number of previous state files to keep

# Exchange configuration
exchanges:
  hyperliquid:
    exchange_name: "hyperliquid"
    enabled: true
    # Mainnet URLs
    api_base_url_mainnet: "https://api.hyperliquid.xyz"
    ws_url_mainnet: "wss://api.hyperliquid.xyz/ws"
    # Testnet URLs
    api_base_url_testnet: "https://api.hyperliquid-testnet.xyz"
    ws_url_testnet: "wss://api.hyperliquid-testnet.xyz/ws"
    # Environment type - explicit testnet selection (safer than boolean)
    environment_type: "testnet"
    # Hyperliquid-specific rate limiting configuration
    ip_weight_limit_per_minute: 1140  # Total IP weight budget per minute
    info_request_type_ip_weights:
      l2Book: 2                      # Level 2 Order Book
      allMids: 2                     # All Mid Prices
      meta: 2                        # Meta info
      metaAndAssetCtxs: 2           # Meta and Asset Contexts
      clearinghouseState: 2         # Clearinghouse State
      openOrders: 1                  # Open Orders
      userFills: 1                   # User Fills
      fundingHistory: 2              # Funding History
      historicalOrders: 5            # Historical Orders
      orderStatus: 1                 # Order Status
      userRole: 60                   # User Role
      recentTrades: 2                # Recent Trades
    default_info_weight: 20          # Default weight for unlisted /info types
    exchange_action_base_ip_weight: 1 # Base IP weight for /exchange actions
    address_action_safety_net:
      rate_per_minute: 1200           # Client-side safety net for address actions HL docs rate limit = 1200
    websocket_send_rate_per_minute: 1800  # 30 msg/sec, under HL's 2000/min limit
    symbols:
      # Map internal symbol names to exchange-specific symbols
      BTC: "BTC"
      ETH: "ETH"
    # Optional HTTP Client Settings (examples)
    request_timeout_seconds: 20
    ws_ping_interval_seconds: 25
    # ws_max_reconnect_attempts: 5  # Example of another optional field
    # Exchange-Specific Parameters (required for Hyperliquid)
    chain_id: 421614

  backpack:
    exchange_name: "backpack"
    enabled: true
    # Mainnet URLs (Backpack currently only has mainnet)
    api_base_url_mainnet: "https://api.backpack.exchange"
    ws_url_mainnet: "wss://ws.backpack.exchange"
    # Testnet URLs not provided (Backpack doesn't have testnet)
    # api_base_url_testnet: null
    # ws_url_testnet: null
    # Environment type - always mainnet for Backpack as they only have mainnet
    environment_type: "mainnet"
    rate_limit_per_minute: 120  # Backpack uses simple rate limiting
    symbols:
      BTC: "BTC_USDC" # Example Spot market
      # BTC: "BTC-PERP" # Example Perp market
      ETH: "ETH_USDC"
    # Optional HTTP Client Settings (examples)
    request_timeout_seconds: 15.0
    # chain_id is not required for Backpack, so it can be omitted
    # Other optional HTTP/WS fields can be omitted to use system defaults

# Strategy configuration (Simplified for Prototype 0.0.1)
strategies:
  # Focus: HyperLiquid Perpetual vs. Backpack Spot
  hl_perp_bp_spot:
    enabled: true
    # Define symbols using the internal names (mapped above)
    long_exchange: "backpack" # Where we go long (buy spot)
    short_exchange: "hyperliquid"  # Where we go short (sell perpetual)
    symbol_long: "BTC"        # Internal symbol for the long leg
    symbol_short: "BTC"       # Internal symbol for the short leg

    params:
      funding_threshold: 0.0001  # Minimum positive funding rate on long leg (HL)
      max_price_spread_pct: 0.002 # Maximum allowed percentage difference between perp and spot price (0.2%)
      min_profit_usd: 1.0      # Minimum estimated profit in USD to consider the trade
      min_funding_differential: 0.0001  # Minimum funding rate differential to consider
      check_interval: 60  # Check for opportunities every 60 seconds
      risk_aversion: 1.5  # Risk aversion parameter for position sizing
      rebalance_threshold: 0.05  # Rebalance when position drift exceeds 5%
      perp_exchange: "hyperliquid"  # Exchange for perpetual positions
      spot_exchange: "backpack"  # Exchange for spot positions

# Risk management (Simplified for Prototype 0.0.1)
risk:
  global:
    max_position_usd: 20000.0      # Increased to be higher than sizing defaults
    max_total_exposure_usd: 100000.0 # Increased proportionally

  # --- Simple Sizing Path (Optional Alternative to Kelly) ---
  use_simple_sizing_path: true            # Default to standard Kelly sizing
  simple_sizing_method: "fixed_fraction" # Default method if simple path is enabled
  simple_fixed_fraction: "0.01"          # Default fraction (1%) if method is fixed_fraction
  simple_fixed_usd_size: "10.0"          # Default USD size if method is fixed_usd

  # Override default sizing settings to ensure validation passes
  sizing:
    max_position_size: 10000.0  # Explicitly set to default (must be <= global max_position_usd)

# Execution parameters
execution:
  # Slippage for market orders (if used, Taker orders preferred for prototype)
  max_slippage_pct: 0.001 # 0.1% maximum slippage tolerance

  # Retry logic for failed API calls (e.g., temporary network issues)
  max_retries: 3
  retry_delay_base_sec: 1.0 # Initial delay in seconds for exponential backoff

  # Delay after placing orders before checking status (improves reliability with mocks/latency)
  settlement_delay: 2.0 # seconds

  # Compensation settings (NEW)
  compensation:
    use_limit_orders: true # Use limit orders for compensation by default
    limit_price_offset_pct: 0.05 # % offset for limit price (0.05%)

# Safety Systems Configuration
safety_systems:
  # Circuit Breakers to halt trading on excessive failures
  circuit_breakers:
    enabled: true
    # Global breaker (trips if *any* exchange hits its limit)
    global_consecutive_failures: 5 # Trips after 5 consecutive failures globally
    global_reset_timeout_sec: 300  # Reset after 5 minutes if tripped

    # Per-exchange breakers
    exchange_consecutive_failures: 3 # Trips after 3 consecutive failures for a specific exchange
    exchange_reset_timeout_sec: 180 # Reset after 3 minutes

  # Position reconciliation checker
  position_reconciliation:
    enabled: true
    check_interval_sec: 600 # Check every 10 minutes
    max_discrepancy_pct: 0.01 # Alert if discrepancy > 0.01% of expected size

  # Balance checker
  balance_monitoring:
    enabled: true
    check_interval_sec: 300 # Check every 5 minutes
    min_balance_thresholds_usd:
      hyperliquid: 100.0
      backpack: 100.0

# Monitoring and Notifications (Simplified placeholders)
monitoring:
  notifications_enabled: true
  alert_methods: ["log"] # Start simple, just log alerts
  # alert_methods: ["log", "telegram"] # Example for later

# Portfolio Tracker Configuration
portfolio_tracker:
  data_freshness_seconds: 60
  initial_balances: {}  # Example: { "hyperliquid": { "USDC": "10000.00" } }
  initial_positions: []  # Example: List of initial derivative positions
  cache:
    enabled: true
    default_ttl: 300.0
    max_size: 10000
    stale_while_revalidate: 60.0
    cleanup_interval: 600.0
    enable_memory_optimization: true
    cache_statistics_enabled: true
  state:
    persist_interval: 60.0
    backup_count: 5
    backup_directory: "data/portfolio_backups"
    atomic_updates: true
    update_timeout: 5.0
    max_concurrent_updates: 1
    validate_on_load: true
    validate_on_update: true
    strict_validation: false
    max_state_history_size: 100
    max_trade_history_size: 1000
  validation:
    enable_balance_validation: true
    balance_tolerance: "0.0001"
    require_non_negative_balances: true
    enable_position_validation: true
    position_size_tolerance: "0.0001"
    max_position_age_seconds: 300
    enable_trade_validation: true
    max_trade_age_seconds: 86400
    require_valid_timestamps: true
    enable_cross_validation: true
    validation_timeout: 3.0  # Less than state.update_timeout (5.0)
    enabled: true
    strict_mode: false
  calculation:
    pnl_calculation_method: "weighted_average"
    include_fees_in_pnl: true
    include_funding_in_pnl: true
    max_exposure_calculation_depth: 100
    group_by_base_asset: true
    exposure_update_interval: 5.0
    calculate_sharpe_ratio: true
    sharpe_lookback_days: 30
    calculate_max_drawdown: true
    performance_update_interval: 300.0
    risk_free_rate: "0.02"
    default_volatility: "0.2"
    stress_scenario_move: "0.1"
    var_confidence_level: "0.95"
    leverage_warning_threshold: "3.0"
    realized_pnl_method: "weighted_average"
    price_cache_ttl: 60
    batch_size_limit: 100
    price_staleness_threshold: 300
  enabled: true
  log_level: "INFO"
  log_performance_metrics: true
  metrics_interval: 300.0
  sync_with_risk_module: true
  sync_with_execution_module: true
  event_driven_updates: true

# Smart symbol configuration (required at root level)
symbols:
  list: ["BTC", "ETH"]
  patterns:
    hyperliquid:
      perp: "{symbol}"
    backpack:
      perp: "{symbol}-PERP"
      spot: "{symbol}_USDC"
  defaults:
    market_type: "PERP"
  overrides: {}
