# Pre-commit hooks for CyberDeltaEngine
# See https://pre-commit.com for more information
repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff - Python linting and formatting (replaces black, isort, and flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      # Run the linter first (includes import sorting)
      - id: ruff
        args: ["--fix", "--show-fixes"]
      # Run the formatter second
      - id: ruff-format

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          # Core dependencies needed for type checking
          - types-jsonschema==4.23.0.20241208
          - types-setuptools==80.7.0.20250516
          - types-pyyaml>=6.0.12.20250402
          - pandas-stubs>=2.2.3.250308
          - msgpack-types==0.5.0
          - types-requests==2.32.0.20250328
          # Runtime dependencies that mypy needs for type checking
          - pydantic==2.11.4
          - aiohttp==3.11.18
          - numpy==2.2.5
          - pandas==2.2.3
        args: ["--strict", "--show-error-codes"]

  # Custom hooks
  - repo: local
    hooks:
      # Prevent new unittest.mock datetime patches
      - id: no-datetime-patches
        name: Check for unittest.mock datetime patches
        entry: scripts/check_time_patterns.py
        language: python
        files: ^tests/.*\.py$
        additional_dependencies: [pyyaml]

      # Ensure timing marker on timing tests
      - id: timing-marker-check
        name: Check timing marker on timing tests
        entry: scripts/check_timing_marker.py
        language: python
        files: ^tests/.*\.py$
