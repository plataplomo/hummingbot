# Pre-commit hooks for CyberDeltaEngine
# See https://pre-commit.com for more information
repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^workflow/
      - id: check-added-large-files
        args: ['--maxkb=2048']  # 2 MB limit
      - id: check-merge-conflict
        exclude: ^workflow/
      - id: debug-statements
        exclude: ^workflow/

  # Ruff - Python linting and formatting (replaces black, isort, and flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      # Run the linter first (includes import sorting)
      - id: ruff
        args: ["--fix", "--show-fixes"]
        files: ^(cyberdelta/.*\.py|main\.py)$
        exclude: ^(workflow/|tests/|vendor/|worktrees/)
      # Run the formatter second
      - id: ruff-format
        files: ^(cyberdelta/.*\.py|main\.py)$
        exclude: ^(workflow/|tests/|vendor/|worktrees/)

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        files: ^(cyberdelta/.*\.py|main\.py)$
        exclude: ^(workflow/|tests/|vendor/|worktrees/)
        additional_dependencies:
          # Type stubs
          - types-jsonschema==4.23.0.20241208
          - types-setuptools==80.7.0.20250516
          - types-pyyaml>=6.0.12.20250402
          - pandas-stubs>=2.2.3.250308
          - msgpack-types==0.5.0
          - types-requests==2.32.0.20250328
          - types-cachetools>=6.0.0.20250525
          - types-orjson
          - types-aiofiles
          # Core runtime dependencies
          - pydantic==2.11.5
          - aiohttp==3.11.18
          - numpy==2.2.5
          # Testing dependencies
          - pytest==8.3.5
          - pytest-asyncio==0.26.0
          - pytest-mock==3.14.0
          - pytest-recording==0.13.4
          - pytest-cov==6.1.1
          - pytest-freezer==0.4.9
          - pytest-timeout==2.4.0
          - hypothesis==6.137.3
          # Crypto dependencies
          - cryptography==45.0.3
          - eth_account==0.13.7
          - web3==7.11.1
          - mnemonic==0.21
          # Other dependencies
          - structlog==25.3.0
          - opentelemetry-sdk==1.33.1
          - orjson==3.10.18
          - cachetools==6.1.0
          - msgspec==0.19.0
          - types-psutil>=7.0.0.20250601,<7.1.0
          - tenacity==9.1.2
          - psutil>=7.0.0,<7.1.0
        args: ["--show-error-codes"]

  # Pyright - Static type checking (strict mode)
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.403
    hooks:
      - id: pyright
        files: ^(cyberdelta/.*\.py|main\.py)$
        exclude: ^(workflow/|tests/|vendor/|worktrees/)
        additional_dependencies:
          # Core runtime dependencies needed for type checking
          - pydantic==2.11.5
          - aiohttp==3.11.18
          - numpy==2.2.5
          - structlog==25.3.0
          - orjson==3.10.18
          - cachetools==6.1.0
          - tenacity==9.1.2
          - psutil>=7.0.0,<7.1.0
          - aiofiles==24.1.0
          - cryptography==45.0.3
          - eth_account==0.13.7
          - web3==7.11.1
          - mnemonic==0.21
          - msgspec==0.19.0
          - PyYAML==6.0.2
          - python-dotenv==1.1.0
        args: ["--pythonversion", "3.13"]

  # Custom hooks
  - repo: local
    hooks:
      # Prevent new unittest.mock datetime patches
      - id: no-datetime-patches
        name: Check for unittest.mock datetime patches
        entry: scripts/check_time_patterns.py
        language: python
        files: ^tests/.*\.py$
        additional_dependencies: [pyyaml]

      # Ensure timing marker on timing tests
      - id: timing-marker-check
        name: Check timing marker on timing tests
        entry: scripts/check_timing_marker.py
        language: python
        files: ^tests/.*\.py$

      # Check for hard-coded fee configurations
      - id: no-hardcoded-fees
        name: Check for hard-coded fee configurations
        entry: python scripts/verify_no_hardcoded_fees.py --exit-on-failure
        language: system
        files: 'cyberdelta/domain/.*\.py$'
        pass_filenames: false
        description: Ensure no hard-coded include_fees values in financial calculations
