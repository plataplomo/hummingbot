[tool.pytest.ini_options]
asyncio_mode = "strict"

# Ruff configuration for linting
[tool.ruff]
exclude = [  # Directories to exclude from linting
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__pycache__",
    "current_workflow",
]
line-length = 100  # Maximum line length for linting
target-version = "py313"  # Target Python version for linting

# Ruff linting options
[tool.ruff.lint]
select = [  # Linting rules to apply
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # upgrade
    "ANN", # annotations
]
# ignore = ["E501", "E402", "ANN401"]  # Ignored linting rules
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"  # Regex for dummy variable names

# MyPy configuration for strict type checking
[tool.mypy]
# Kept as the strictest type checker
python_version = "3.13"  # Specify Python version for MyPy
warn_return_any = true  # Warn about functions that return Any
disallow_untyped_defs = true  # Disallow untyped function definitions
disallow_incomplete_defs = true  # Disallow incomplete function definitions
check_untyped_defs = true  # Check untyped function definitions
disallow_untyped_decorators = true  # Disallow untyped decorators
warn_redundant_casts = true  # Warn about redundant casts
warn_unused_ignores = true  # Warn about unused type ignores
warn_no_return = true  # Warn about functions that do not return a value
warn_unreachable = true  # Warn about unreachable code
strict_equality = true  # Enforce strict equality checks
extra_checks = true  # Enable extra checks
scripts_are_modules = true  # Treat scripts as modules