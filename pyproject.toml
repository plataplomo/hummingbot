# Start of Selection
# Build system configuration specifying the requirements for building the package
[build-system]
requires = ["setuptools>=61.0", "wheel"]  # Required packages for building the project
build-backend = "setuptools.build_meta"    # Backend used for building the package

# Project metadata including name, version, description, and other details
[project]
name = "CyberDeltaEngine"  # Name of the project
version = "0.0.1"   # Current version of the project
description = "CyberDeltaEngine: An automated, asyncio-based Python trading engine for delta-neutral arbitrage strategies (initially funding rate arbitrage between Hyperliquid and Backpack perpetuals)."  # Brief description of the project
readme = { file = "README.md", content-type = "text/markdown" }  # Readme file and its content type
requires-python = ">=3.13"  # Minimum required Python version
license = { text = "MIT" }  # License information for the project
authors = [  # List of authors with their names and emails
    {name = "plataplomo", email = "bizonum@gmail.com"},
]

classifiers = [  # Classifiers for the project to help users find it
    "Development Status :: 2 - Pre-Alpha",  # Current development status
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent"
]

dependencies = [
    "aiohttp==3.11.18",
    "websockets==13.1.0",
    "numpy==2.2.5",
    "PyYAML==6.0.2",
    "python-dotenv==1.1.0",
    "matplotlib==3.10.3",
    "simplejson==3.20.1",
    "pydantic==2.11.4",
    "eth_account==0.13.7",
    "web3==7.11.1",
    "structlog==25.3.0",
    "pandas==2.2.3",
    "plotly==6.0.1",
    "dash==3.0.4",
    "dash-bootstrap-components==2.0.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "mnemonic==0.21",
    "logfire==3.16.1",
    "msgpack==1.1.0",
    "cryptography==45.0.3",
    "pre-commit>=4.2.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-recording==0.13.4",
    "pytest-cov==6.1.1",
    "pytest-mock==3.14.0",
    "pytest-freezer==0.4.9",
    "pytest-timeout==2.4.0",
]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.9",
    "pyright>=1.1.400",
    "pip>=25.1.1",
    "uv>=0.7.3",
    "pre-commit>=4.0.0",
    "types-jsonschema==4.23.0.20241208,<4.30.0",
    "jsonschema==4.23.0",
    "types-setuptools==80.7.0.20250516,<81.0.0",
    "types-pyyaml>=6.0.12.20250402,<6.1.0",
    "pandas-stubs>=2.2.3.250308,<2.3",
    "msgpack-types==0.5.0,<=0.6.0",
    "types-requests==2.32.0.20250328,<2.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=cyberdelta",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "file_io: marks tests that perform file I/O operations",
    "network: marks tests that require network access",
    "timing: marks tests that depend on timing/sleep operations",
    "vcr_cassette_dir: specify custom VCR cassette directory (usage: @pytest.mark.vcr_cassette_dir('api/backpack/public'))",
    "spot: marks tests as spot trading specific tests",
    "perp: marks tests as perpetual/derivatives trading specific tests",
    "cross_exchange: marks tests as cross-exchange validation tests",
    "requires_balance: marks tests requiring real money/balance (use with caution)",
    "zero_balance: marks tests with zero balance scenarios (safe to run)",
    "positive_balance: marks tests requiring positive balance",
    "account: marks tests as account management specific tests",
    "shared: marks tests as shared/common functionality tests",
    "websockets: marks tests as websocket specific tests",
    "websocket: marks tests as websocket specific tests (variant)",
    "balances: marks tests as balance related tests",
    "orders: marks tests as order related tests",
    "positions: marks tests as position related tests",
    "positive_orders: marks tests requiring positive balance for order operations",
    "requires_network: marks tests that require network connectivity",
    "no_cover: marks tests to exclude from coverage calculations",
    "positive_positions: marks tests requiring positive balance for position operations",
    "zero_orders: marks tests with zero order scenarios",
    "zero_positions: marks tests with zero position scenarios",
    "large_positions: marks tests as large position specific tests",
    "requires_large_balance: marks tests requiring large balance for testing maximum limits",
]

# Ruff configuration for linting
[tool.ruff]
exclude = [  # Directories to exclude from linting
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__pycache__",
    "current_workflow",
]
line-length = 100  # Maximum line length for linting
target-version = "py313"  # Target Python version for linting
preview = true  # Enable preview features to match pre-commit

# Ruff linting options
[tool.ruff.lint]
select = [  # Linting rules to apply
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # upgrade
    "ANN", # annotations
    "T",   # typing
    "D",   # docstrings
    "Q",   # quality
    "COM", # comments
    "S",   # security
    "C",   # complexity
    "FURB",# bugbear
    "RET", # return
#    "TC",  # type-checking
    "RUF", # redundant-use-of-function
    "SIM", # similar
    "ERA", # commented-out-code
#    "DOC", # docstrings
    "INP", # import
    "PLR2004",  # magic-value-comparison (good for trading systems)
    "PLR6201",  # literal-membership (performance improvement)
    "PLR1714",  # repeated-equality-comparison (cleaner code)
    "PLR6104",  # non-augmented-assignment (minor improvement)
    "G",
    "DTZ",
    "PT",
    "NPY",
    "PERF",
    "A",
    "EXE",  # executable code
    "N",
]

# Ignore rules that conflict with current codebase formatting
ignore = [
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)
    "COM812", # Missing commas is managed by ruff formatter
    # PLR rules to ignore (incompatible with stateful service architecture)
    "PLR6301",  # no-self-use (bad for architecture)
    "PLR0913",  # too-many-arguments (often needed in trading)
    "PLR0917",  # too-many-positional-arguments (often needed)
    "PLR0904",  # too-many-public-methods (services need many methods)
    "PLR0911",  # too-many-return-statements (complex business logic)
    "PLR0912",  # too-many-branches (complex business logic)
    "PLR0914",  # too-many-locals (complex calculations)
    "PLR0915",  # too-many-statements (complex workflows)
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"  # Regex for dummy variable names

# Per-path ignores
[tool.ruff.lint.per-file-ignores]
# Allow assert statements and subprocess calls in tests
# allow magic value comparisons
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "PLR6201", "PT011", "PT012", "N802", "N803", "N806"]
"tests/integration/test_config_example.py" = ["S603", "S404"]  # Allow subprocess calls for testing config script
# Examples are demonstration scripts with proper __init__.py but ruff has detection issues
"examples/*.py" = ["INP001"]
# Scripts are standalone and don't need __init__.py
"scripts/**/*.py" = ["INP001"]
# AST visitor methods require specific naming convention
"scripts/analyze_time_mocking_patterns.py" = ["N802"]
# API models must match external API field names (camelCase)
"cyberdelta/apis/backpack/models/bp_*.py" = ["N815"]
"cyberdelta/apis/hyperliquid/models/hl_*.py" = ["N815"]

# Configure pydocstyle to match current docstring conventions
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstring conventions

# Configure import sorting (isort-compatible)
[tool.ruff.lint.isort]
# Known first-party imports for proper grouping
known-first-party = ["cyberdelta"]
# Known third-party packages
known-third-party = ["pytest", "pydantic", "numpy", "pandas"]
# Split imports onto multiple lines based on line-length setting
force-single-line = false
# Combine "from x import a, b" on same line when possible
combine-as-imports = true
# Split imports with trailing comma
split-on-trailing-comma = true
# Add required blank lines after imports
lines-after-imports = 2
# Force imports to be sorted within their sections
force-sort-within-sections = false
# Case-sensitive sorting
case-sensitive = false

# Ruff formatter configuration (Black-compatible)
[tool.ruff.format]
# Use double quotes to match codebase style
quote-style = "double"
# Use 4 spaces for indentation
indent-style = "space"
# Respect magic trailing comma (Black behavior)
skip-magic-trailing-comma = false
# Unix line endings
line-ending = "auto"
# Format code in docstrings
docstring-code-format = true
# Format code in docstrings with shorter line length
docstring-code-line-length = 72

# MyPy configuration for strict type checking
[tool.mypy]
# Kept as the strictest type checker
python_version = "3.13"  # Specify Python version for MyPy
warn_return_any = true  # Warn about functions that return Any
disallow_untyped_defs = true  # Disallow untyped function definitions
disallow_incomplete_defs = true  # Disallow incomplete function definitions
check_untyped_defs = true  # Check untyped function definitions
disallow_untyped_decorators = true  # Disallow untyped decorators
warn_redundant_casts = true  # Warn about redundant casts
warn_unused_ignores = true  # Warn about unused type ignores
warn_no_return = true  # Warn about functions that do not return a value
warn_unreachable = true  # Warn about unreachable code
strict_equality = true  # Enforce strict equality checks
extra_checks = true  # Enable extra checks
scripts_are_modules = true  # Treat scripts as modules

# More lenient settings for test files
# [[tool.mypy.overrides]]
# module = "tests.*"
# disallow_untyped_decorators = false  # Allow untyped pytest fixtures and decorators
# disallow_untyped_defs = false  # Allow untyped test functions


[tool.pyright]
typeCheckingMode = "strict"  # Match Pylance
include = ["scripts", "cyberdelta", "tests", "examples"] # tempopary because PC got irresponsive with too many errors
extraPaths = ["./main.py"]
exclude = ["**/workflow/**", "**/.venv/**", "**/venv/**"]
pythonVersion = "3.13"
reportMissingTypeStubs = "error"  # Enforce stubs
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownLambdaType = "error"
reportMissingImports = true
reportMissingModuleSource = true
reportAttributeAccessIssue = "error"
reportReturnType = "error"
reportOptionalSubscript = "error"
reportGeneralTypeIssues = "error"
reportAssignmentType = "error"
